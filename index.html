<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>TaskFlow — задачи</title>
  <style>
    :root{
      --bg:#10131b;
      --panel:#171b25;
      --text:#f7f7fb;
      --muted:#aeb4c4;
      --line:rgba(255,255,255,.12);
      --accent:#ff5a4f;
      --accent2:#e44332;
      --green:#42d67a;
      --r:22px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      background:
        radial-gradient(circle at top left,rgba(255,90,79,.24),transparent 34%),
        radial-gradient(circle at bottom right,rgba(88,119,255,.18),transparent 36%),
        var(--bg);
      color:var(--text);
    }

    button,input,select{font:inherit}
    button{cursor:pointer}

    .app{
      width:min(1100px,calc(100% - 28px));
      margin:18px auto;
      display:grid;
      grid-template-columns:280px 1fr;
      min-height:calc(100vh - 36px);
      overflow:hidden;
      border:1px solid var(--line);
      border-radius:30px;
      background:rgba(23,27,37,.88);
      box-shadow:0 24px 70px rgba(0,0,0,.36);
    }

    aside{
      padding:22px;
      border-right:1px solid var(--line);
      background:rgba(10,12,18,.38);
    }

    .brand{
      display:flex;
      gap:12px;
      align-items:center;
      margin-bottom:24px;
    }

    .logo{
      width:42px;
      height:42px;
      border-radius:14px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--accent2),var(--accent));
      font-weight:900;
    }

    .brand h1{margin:0;font-size:20px}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}

    .side-title{
      margin:20px 0 10px;
      color:var(--muted);
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
    }

    .nav,.project{
      width:100%;
      border:0;
      border-radius:15px;
      margin-bottom:7px;
      padding:12px 13px;
      color:var(--text);
      background:transparent;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      text-align:left;
    }

    .nav.active,.project.active,.nav:hover,.project:hover{
      background:rgba(255,255,255,.08);
    }

    .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
    }

    .icon{
      width:30px;
      height:30px;
      border-radius:10px;
      background:rgba(255,255,255,.07);
      display:grid;
      place-items:center;
      flex:none;
    }

    .name{
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .badge{
      min-width:24px;
      height:24px;
      padding:0 8px;
      border-radius:999px;
      display:grid;
      place-items:center;
      background:rgba(255,255,255,.08);
      color:var(--muted);
      font-size:12px;
    }

    .add-project{
      display:flex;
      gap:8px;
      margin-top:12px;
    }

    .add-project input,.search,.task-input,.select{
      width:100%;
      border:1px solid var(--line);
      outline:none;
      border-radius:15px;
      padding:14px 15px;
      background:#11151e;
      color:var(--text);
    }

    .add-project input{padding:12px}

    .small{
      border:0;
      border-radius:13px;
      padding:0 14px;
      background:var(--accent2);
      color:#fff;
      font-weight:800;
    }

    main{
      padding:28px;
      min-width:0;
    }

    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:16px;
      margin-bottom:22px;
    }

    .top h2{
      margin:0;
      font-size:clamp(30px,5vw,46px);
      letter-spacing:-.04em;
    }

    .top p{
      margin:8px 0 0;
      color:var(--muted);
      font-size:18px;
    }

    .stats{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .stat{
      min-width:118px;
      padding:15px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.055);
    }

    .stat strong{
      display:block;
      font-size:26px;
    }

    .stat span{
      color:var(--muted);
      font-size:13px;
    }

    .composer{
      display:grid;
      grid-template-columns:1fr 180px auto;
      gap:10px;
      padding:12px;
      border:1px solid var(--line);
      border-radius:var(--r);
      background:rgba(255,255,255,.06);
      margin-bottom:18px;
    }

    .add-task{
      border:0;
      border-radius:15px;
      padding:0 24px;
      background:linear-gradient(135deg,var(--accent2),var(--accent));
      color:#fff;
      font-weight:900;
    }

    .tools{
      display:flex;
      gap:12px;
      justify-content:space-between;
      margin-bottom:14px;
    }

    .clear{
      border:1px solid var(--line);
      border-radius:15px;
      padding:12px 14px;
      background:rgba(255,255,255,.04);
      color:var(--muted);
    }

    .mobile{display:none}

    .list{
      display:grid;
      gap:10px;
    }

    .task{
      display:grid;
      grid-template-columns:auto 1fr auto;
      gap:14px;
      align-items:center;
      padding:15px;
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(255,255,255,.055);
    }

    .check{
      width:28px;
      height:28px;
      border-radius:50%;
      border:2px solid rgba(255,255,255,.32);
      background:transparent;
      color:transparent;
      display:grid;
      place-items:center;
    }

    .check.done{
      background:var(--green);
      border-color:var(--green);
      color:#092012;
    }

    .title{
      margin:0;
      overflow-wrap:anywhere;
    }

    .task.done .title{
      text-decoration:line-through;
      color:var(--muted);
    }

    .meta{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:7px;
      color:var(--muted);
      font-size:12px;
    }

    .pill{
      padding:5px 9px;
      border-radius:999px;
      background:rgba(255,255,255,.07);
    }

    .actions{
      display:flex;
      gap:8px;
    }

    .ghost{
      border:0;
      width:38px;
      height:38px;
      border-radius:12px;
      background:rgba(255,255,255,.07);
      color:var(--muted);
    }

    .empty{
      padding:42px 18px;
      text-align:center;
      color:var(--muted);
      border:1px dashed rgba(255,255,255,.2);
      border-radius:var(--r);
      background:rgba(255,255,255,.035);
    }

    .hint{
      margin:-8px 0 16px;
      color:var(--muted);
      font-size:13px;
    }

    @media(max-width:860px){
      .app{
        width:100%;
        margin:0;
        min-height:100vh;
        border-radius:0;
        grid-template-columns:1fr;
      }

      .app aside{display:none}

      main{
        padding:20px 16px 28px;
      }

      .top{display:block}
      .top p{font-size:17px}
      .stats{margin-top:16px}

      .composer{
        grid-template-columns:1fr;
      }

      .add-task{
        padding:15px;
      }

      .tools{
        flex-direction:column;
      }

      .mobile{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        margin-bottom:14px;
      }

      .mobile button{
        border:1px solid var(--line);
        border-radius:14px;
        padding:12px;
        background:rgba(255,255,255,.05);
        color:var(--text);
      }

      .mobile button.active{
        background:rgba(255,90,79,.18);
        border-color:rgba(255,90,79,.55);
      }

      .task{
        grid-template-columns:auto 1fr;
      }

      .actions{
        grid-column:2;
      }

      .select,.task-input{
        font-size:16px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand">
        <div class="logo">✓</div>
        <div>
          <h1>TaskFlow</h1>
          <p>как Todoist, проще</p>
        </div>
      </div>

      <div class="side-title">Папки</div>

      <button class="nav active" data-filter="active">
        <span class="left"><span class="icon">📥</span>Активные</span>
        <span class="badge" id="activeCount">0</span>
      </button>

      <button class="nav" data-filter="completed">
        <span class="left"><span class="icon">✅</span>Выполненные</span>
        <span class="badge" id="completedCount">0</span>
      </button>

      <button class="nav" data-filter="all">
        <span class="left"><span class="icon">🗂️</span>Все задачи</span>
        <span class="badge" id="allCount">0</span>
      </button>

      <div class="side-title">Подгруппы</div>
      <div id="projectList"></div>

      <form class="add-project" id="projectForm">
        <input id="projectInput" placeholder="Новая подгруппа">
        <button class="small" type="submit">+</button>
      </form>
    </aside>

    <main>
      <div class="top">
        <div>
          <h2 id="pageTitle">Активные задачи</h2>
          <p>Записывай дела, разделяй их по подгруппам и отмечай выполненное.</p>
        </div>

        <div class="stats">
          <div class="stat">
            <strong id="statActive">0</strong>
            <span>активные</span>
          </div>
          <div class="stat">
            <strong id="statDone">0</strong>
            <span>выполненные</span>
          </div>
        </div>
      </div>

      <div class="mobile" id="mobileFilters"></div>

      <form class="composer" id="taskForm">
        <input class="task-input" id="taskInput" placeholder="Что нужно сделать? Например: подготовить доклад" autocomplete="off">
        <select class="select" id="projectSelect"></select>
        <button class="add-task" type="submit">Добавить</button>
      </form>

      <div class="hint" id="statusText">Выбери подгруппу и нажми «Добавить».</div>

      <div class="tools">
        <input class="search" id="searchInput" placeholder="Поиск задачи...">
        <button class="clear" id="clearDone" type="button">Очистить выполненные</button>
      </div>

      <section class="list" id="taskList"></section>
    </main>
  </div>

<script>
(function(){
  var KEY = 'taskflow-data-v3';

  var defaults = {
    projects: ['Учёба','Работа','Личное'],
    tasks: []
  };

  var data = load();
  var filter = 'active';
  var project = null;

  function $(id){
    return document.getElementById(id);
  }

  var els = {
    taskForm: $('taskForm'),
    taskInput: $('taskInput'),
    projectSelect: $('projectSelect'),
    projectForm: $('projectForm'),
    projectInput: $('projectInput'),
    projectList: $('projectList'),
    taskList: $('taskList'),
    searchInput: $('searchInput'),
    pageTitle: $('pageTitle'),
    mobileFilters: $('mobileFilters'),
    clearDone: $('clearDone'),
    activeCount: $('activeCount'),
    completedCount: $('completedCount'),
    allCount: $('allCount'),
    statActive: $('statActive'),
    statDone: $('statDone'),
    statusText: $('statusText')
  };

  function id(){
    return 't-' + Date.now() + '-' + Math.floor(Math.random() * 1000000);
  }

  function load(){
    var raw = null;

    try {
      raw = localStorage.getItem(KEY);
    } catch(e) {}

    var obj;

    try {
      obj = raw ? JSON.parse(raw) : null;
    } catch(e) {
      obj = null;
    }

    if (!obj || !Array.isArray(obj.projects) || !Array.isArray(obj.tasks)) {
      obj = JSON.parse(JSON.stringify(defaults));
    }

    obj.projects = obj.projects.filter(Boolean).map(String);

    if (obj.projects.length === 0) {
      obj.projects = defaults.projects.slice();
    }

    obj.tasks = obj.tasks
      .filter(function(t){ return t && t.title; })
      .map(function(t){
        return {
          id: t.id || id(),
          title: String(t.title),
          project: t.project && obj.projects.indexOf(t.project) > -1 ? String(t.project) : obj.projects[0],
          done: !!t.done,
          createdAt: t.createdAt || Date.now()
        };
      });

    return obj;
  }

  function save(){
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch(e) {}
  }

  function esc(s){
    return String(s).replace(/[&<>"']/g,function(c){
      return {
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c];
    });
  }

  function render(){
    renderSelect();
    renderProjects();
    renderMobile();
    renderTasks();
    renderStats();
  }

  function renderSelect(){
    if (!data.projects.length) {
      data.projects = defaults.projects.slice();
    }

    els.projectSelect.innerHTML = data.projects.map(function(p){
      return '<option value="' + esc(p) + '">' + esc(p) + '</option>';
    }).join('');

    if (project && data.projects.indexOf(project) > -1) {
      els.projectSelect.value = project;
    }
  }

  function list(){
    var q = els.searchInput.value.trim().toLowerCase();

    return data.tasks.filter(function(t){
      if (filter === 'active' && t.done) return false;
      if (filter === 'completed' && !t.done) return false;
      if (project && t.project !== project) return false;

      if (q && t.title.toLowerCase().indexOf(q) < 0 && t.project.toLowerCase().indexOf(q) < 0) {
        return false;
      }

      return true;
    }).sort(function(a,b){
      return Number(a.done) - Number(b.done) || b.createdAt - a.createdAt;
    });
  }

  function renderTasks(){
    var tasks = list();
    els.taskList.innerHTML = '';

    els.pageTitle.textContent = project ? project : ({
      active:'Активные задачи',
      completed:'Выполненные',
      all:'Все задачи'
    }[filter] || 'Задачи');

    if (!tasks.length) {
      els.taskList.innerHTML = '<div class="empty">Пока пусто. Напиши задачу сверху и нажми «Добавить».</div>';
      return;
    }

    tasks.forEach(function(t){
      var el = document.createElement('article');
      el.className = 'task ' + (t.done ? 'done' : '');

      el.innerHTML =
        '<button class="check ' + (t.done ? 'done' : '') + '" type="button">✓</button>' +
        '<div>' +
          '<p class="title"></p>' +
          '<div class="meta">' +
            '<span class="pill">' + esc(t.project) + '</span>' +
            '<span class="pill">' + (t.done ? 'В папке «Выполненные»' : 'Активная') + '</span>' +
          '</div>' +
        '</div>' +
        '<div class="actions">' +
          '<button class="ghost edit" type="button">✎</button>' +
          '<button class="ghost del" type="button">×</button>' +
        '</div>';

      el.querySelector('.title').textContent = t.title;

      el.querySelector('.check').onclick = function(){
        t.done = !t.done;
        save();
        render();
      };

      el.querySelector('.del').onclick = function(){
        data.tasks = data.tasks.filter(function(x){
          return x.id !== t.id;
        });
        save();
        render();
      };

      el.querySelector('.edit').onclick = function(){
        var n = prompt('Изменить задачу:', t.title);
        if (n && n.trim()) {
          t.title = n.trim();
          save();
          render();
        }
      };

      els.taskList.appendChild(el);
    });
  }

  function renderProjects(){
    els.projectList.innerHTML = '';

    data.projects.forEach(function(p){
      var count = data.tasks.filter(function(t){
        return t.project === p && !t.done;
      }).length;

      var b = document.createElement('button');
      b.className = 'project ' + (project === p ? 'active' : '');
      b.type = 'button';

      b.innerHTML =
        '<span class="left">' +
          '<span class="icon">#</span>' +
          '<span class="name">' + esc(p) + '</span>' +
        '</span>' +
        '<span class="badge">' + count + '</span>';

      b.onclick = function(){
        project = project === p ? null : p;
        filter = 'active';
        render();
      };

      els.projectList.appendChild(b);
    });
  }

  function renderMobile(){
    var arr = [
      ['active','Активные'],
      ['completed','Выполненные'],
      ['all','Все'],
      ['choose',project ? '# ' + project : 'Подгруппы']
    ];

    els.mobileFilters.innerHTML = arr.map(function(x){
      var active = (x[0] === filter && !project) || (x[0] === 'choose' && project);
      return '<button type="button" class="' + (active ? 'active' : '') + '" data-k="' + x[0] + '">' + esc(x[1]) + '</button>';
    }).join('');

    Array.prototype.forEach.call(els.mobileFilters.querySelectorAll('button'),function(b){
      b.onclick = function(){
        var k = b.getAttribute('data-k');

        if (k === 'choose') {
          var ch = prompt('Напиши подгруппу точно так же:\n' + data.projects.join(', '));
          if (ch && data.projects.indexOf(ch.trim()) > -1) {
            project = ch.trim();
            filter = 'active';
          }
        } else {
          filter = k;
          project = null;
        }

        render();
      };
    });
  }

  function renderStats(){
    var active = data.tasks.filter(function(t){
      return !t.done;
    }).length;

    var done = data.tasks.filter(function(t){
      return t.done;
    }).length;

    els.activeCount.textContent = active;
    els.completedCount.textContent = done;
    els.allCount.textContent = data.tasks.length;
    els.statActive.textContent = active;
    els.statDone.textContent = done;

    Array.prototype.forEach.call(document.querySelectorAll('.nav'),function(b){
      b.classList.toggle('active', b.getAttribute('data-filter') === filter && !project);
    });
  }

  els.taskForm.onsubmit = function(e){
    e.preventDefault();

    var title = els.taskInput.value.trim();

    if (!title) {
      els.statusText.textContent = 'Сначала напиши текст задачи.';
      els.taskInput.focus();
      return false;
    }

    if (!data.projects.length) {
      data.projects = defaults.projects.slice();
    }

    var p = els.projectSelect.value || data.projects[0] || 'Без группы';

    if (data.projects.indexOf(p) === -1) {
      data.projects.push(p);
    }

    data.tasks.unshift({
      id: id(),
      title: title,
      project: p,
      done: false,
      createdAt: Date.now()
    });

    els.taskInput.value = '';
    filter = 'active';
    project = null;

    save();
    render();

    els.statusText.textContent = 'Задача добавлена.';

    return false;
  };

  els.projectForm.onsubmit = function(e){
    e.preventDefault();

    var p = els.projectInput.value.trim();

    if (p && data.projects.indexOf(p) === -1) {
      data.projects.push(p);
      els.projectInput.value = '';
      save();
      render();
    }
  };

  els.searchInput.oninput = renderTasks;

  els.clearDone.onclick = function(){
    data.tasks = data.tasks.filter(function(t){
      return !t.done;
    });
    save();
    render();
  };

  Array.prototype.forEach.call(document.querySelectorAll('.nav'),function(b){
    b.onclick = function(){
      filter = b.getAttribute('data-filter');
      project = null;
      render();
    };
  });

  render();
})();
</script>
</body>
</html>
